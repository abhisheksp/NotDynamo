apiVersion: batch/v1
kind: Job
metadata:
  name: notdynamo-bench-k6-20260219212757
  namespace: notdynamo
  labels:
    app: notdynamo-bench
    benchmark-category: in-cluster
    benchmark-driver: k6
spec:
  ttlSecondsAfterFinished: 900
  backoffLimit: 0
  parallelism: 2
  completions: 2
  template:
    metadata:
      labels:
        app: notdynamo-bench
        benchmark-category: in-cluster
        benchmark-driver: k6
    spec:
      restartPolicy: Never
      nodeSelector:
        "notdynamo.io/workload": "benchmark"
      tolerations:
        - key: "notdynamo.io/workload"
          operator: "Equal"
          value: "benchmark"
          effect: "NoSchedule"
      volumes:
        - name: bench-script
          configMap:
            name: notdynamo-bench-k6-script-20260219212757
      containers:
        - name: k6
          image: grafana/k6:0.49.0
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              k6 run --quiet --summary-export=/tmp/summary.json /scripts/bench.js
              status=$?
              echo "__K6_SUMMARY_BEGIN__"
              if [ -f /tmp/summary.json ]; then cat /tmp/summary.json; echo; fi
              echo "__K6_SUMMARY_END__"
              exit $status
          env:
            - name: BASE_URL
              value: "http://notdynamo-data.notdynamo.svc.cluster.local:8080"
            - name: KEYSPACE
              value: "500"
            - name: VALUE_BYTES
              value: "256"
            - name: READ_RATIO
              value: "0.95"
            - name: DISTRIBUTION
              value: "uniform"
            - name: PRELOAD
              value: "true"
            - name: SKIP_MAIN
              value: "true"
            - name: K6_VUS
              value: "8"
            - name: K6_DURATION
              value: "90s"
            - name: SETUP_TIMEOUT
              value: "10m"
            - name: REQUEST_TIMEOUT_MS
              value: "6000"
            - name: PRELOAD_RETRIES
              value: "3"
            - name: PRELOAD_RETRY_SLEEP_MS
              value: "5"
          volumeMounts:
            - name: bench-script
              mountPath: /scripts
              readOnly: true
