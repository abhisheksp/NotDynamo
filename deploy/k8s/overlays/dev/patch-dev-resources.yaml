apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: notdynamo-data
spec:
  template:
    spec:
      containers:
        - name: node
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notdynamo-control-plane
spec:
  template:
    spec:
      containers:
        - name: control-plane
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
