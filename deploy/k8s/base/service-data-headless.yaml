apiVersion: v1
kind: Service
metadata:
  name: notdynamo-data-headless
spec:
  clusterIP: None
  # Keep stable per-pod DNS entries even during readiness flaps so inter-node
  # forwarding and Raft peer links do not fail hostname resolution.
  publishNotReadyAddresses: true
  selector:
    app: notdynamo-data
  ports:
    - name: grpc
      port: 9090
      targetPort: grpc
    - name: http
      port: 8080
      targetPort: http
