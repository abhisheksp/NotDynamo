apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: notdynamo-data
spec:
  serviceName: notdynamo-data-headless
  replicas: 3
  selector:
    matchLabels:
      app: notdynamo-data
  template:
    metadata:
      labels:
        app: notdynamo-data
    spec:
      serviceAccountName: notdynamo-sa
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: notdynamo-data
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: topology.kubernetes.io/zone
                    operator: Exists
      containers:
        - name: node
          image: ghcr.io/notdynamo/notdynamo:dev
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c", "echo notdynamo data node placeholder && sleep 3600"]
          ports:
            - name: grpc
              containerPort: 9090
            - name: http
              containerPort: 8080
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          volumeMounts:
            - name: data
              mountPath: /var/lib/notdynamo
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
