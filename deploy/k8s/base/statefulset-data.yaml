apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: notdynamo-data
spec:
  serviceName: notdynamo-data-headless
  podManagementPolicy: Parallel
  replicas: 3
  selector:
    matchLabels:
      app: notdynamo-data
  template:
    metadata:
      labels:
        app: notdynamo-data
    spec:
      serviceAccountName: notdynamo-sa
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: notdynamo-data
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: topology.kubernetes.io/zone
                    operator: Exists
      containers:
        - name: node
          image: ghcr.io/notdynamo/notdynamo:dev
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c", "exec /opt/notdynamo/bin/node"]
          ports:
            - name: grpc
              containerPort: 9090
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NOTDYNAMO_NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NOTDYNAMO_HOST
              value: "0.0.0.0"
            - name: NOTDYNAMO_GRPC_PORT
              value: "9090"
            - name: NOTDYNAMO_HTTP_PORT
              value: "8080"
            - name: NOTDYNAMO_SHARD_COUNT
              value: "2048"
            - name: NOTDYNAMO_VIRTUAL_NODES_PER_SHARD
              value: "256"
            - name: NOTDYNAMO_DATA_DIR
              value: "/var/lib/notdynamo"
          volumeMounts:
            - name: data
              mountPath: /var/lib/notdynamo
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
