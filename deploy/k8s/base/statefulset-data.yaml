apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: notdynamo-data
spec:
  serviceName: notdynamo-data-headless
  podManagementPolicy: Parallel
  replicas: 3
  selector:
    matchLabels:
      app: notdynamo-data
  template:
    metadata:
      labels:
        app: notdynamo-data
    spec:
      serviceAccountName: notdynamo-sa
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: notdynamo-data
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: topology.kubernetes.io/zone
                    operator: Exists
      containers:
        - name: node
          image: ghcr.io/notdynamo/notdynamo:dev
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c", "exec /opt/notdynamo/bin/node"]
          ports:
            - name: grpc
              containerPort: 9090
            - name: http
              containerPort: 8080
            - name: ratis
              containerPort: 10090
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 90
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NOTDYNAMO_NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NOTDYNAMO_HOST
              value: "0.0.0.0"
            - name: NOTDYNAMO_GRPC_PORT
              value: "9090"
            - name: NOTDYNAMO_HTTP_PORT
              value: "8080"
            - name: NOTDYNAMO_HTTP_WORKER_THREADS
              value: "64"
            - name: NOTDYNAMO_SHARD_COUNT
              value: "128"
            - name: NOTDYNAMO_VIRTUAL_NODES_PER_SHARD
              value: "256"
            - name: NOTDYNAMO_RUNTIME_MODE
              value: "partitioned"
            - name: NOTDYNAMO_RPC_MODE
              value: "grpc"
            - name: NOTDYNAMO_RPC_TIMEOUT_MS
              value: "5000"
            - name: NOTDYNAMO_RATIS_PORT
              value: "10090"
            - name: NOTDYNAMO_RATIS_GROUP_NAME
              value: "notdynamo-main"
            - name: NOTDYNAMO_RATIS_REQUEST_TIMEOUT_MS
              value: "5000"
            - name: NOTDYNAMO_WRITE_POLICY
              value: "raft"
            - name: NOTDYNAMO_WRITE_QUORUM_ACKS
              value: "2"
            - name: NOTDYNAMO_WRITE_GLOBAL_INFLIGHT_LIMIT
              value: "256"
            - name: NOTDYNAMO_WRITE_SHARD_INFLIGHT_MIN
              value: "8"
            - name: NOTDYNAMO_WRITE_ADMISSION_WAIT_MS
              value: "2"
            - name: NOTDYNAMO_RATIS_MAX_INFLIGHT_PER_SHARD
              value: "16"
            - name: NOTDYNAMO_READ_CONSISTENCY
              value: "eventual"
            - name: NOTDYNAMO_EVENTUAL_FRESHNESS_MILLIS
              value: "1000"
            - name: NOTDYNAMO_REPLICATION_FACTOR
              value: "3"
            - name: NOTDYNAMO_PARTITION_MAP_SOURCE
              value: "control-plane"
            - name: NOTDYNAMO_CONTROL_PLANE_PARTITION_MAP_ENDPOINT
              value: "http://notdynamo-control-plane:9090/v1/partition-map"
            - name: NOTDYNAMO_CONTROL_PLANE_PARTITION_MAP_TIMEOUT_MS
              value: "1500"
            - name: NOTDYNAMO_CONTROL_PLANE_PARTITION_MAP_REFRESH_INTERVAL_MS
              value: "2000"
            - name: NOTDYNAMO_CONTROL_PLANE_WRITE_LOAD_REPORT_INTERVAL_MS
              value: "10000"
            - name: NOTDYNAMO_CLUSTER_SIZE
              value: "3"
            - name: NOTDYNAMO_STATEFULSET_NAME
              value: "notdynamo-data"
            - name: NOTDYNAMO_HEADLESS_SERVICE
              value: "notdynamo-data-headless"
            - name: NOTDYNAMO_NAMESPACE
              value: "notdynamo"
            - name: NOTDYNAMO_DATA_DIR
              value: "/var/lib/notdynamo"
          volumeMounts:
            - name: data
              mountPath: /var/lib/notdynamo
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
