syntax = "proto3";

package notdynamo.v1;

option java_multiple_files = true;
option java_package = "io.notdynamo.proto.v1";
option java_outer_classname = "KvProto";

enum StatusCode {
  STATUS_CODE_UNSPECIFIED = 0;
  STATUS_CODE_OK = 1;
  STATUS_CODE_NOT_FOUND = 2;
  STATUS_CODE_INVALID_ARGUMENT = 3;
  STATUS_CODE_UNAVAILABLE = 4;
  STATUS_CODE_TIMEOUT = 5;
  STATUS_CODE_INTERNAL = 6;
}

message Error {
  StatusCode code = 1;
  string message = 2;
}

message GetRequest {
  bytes key = 1;
}

message GetResponse {
  bytes value = 1;
  uint64 version = 2;
  bool found = 3;
  Error error = 4;
}

message PutRequest {
  bytes key = 1;
  bytes value = 2;
}

message PutResponse {
  uint64 version = 1;
  Error error = 2;
}

message DeleteRequest {
  bytes key = 1;
}

message DeleteResponse {
  uint64 version = 1;
  Error error = 2;
}

message HealthRequest {}

message HealthResponse {
  string node_id = 1;
  bool ready = 2;
  string partition_map_epoch = 3;
}

service KvService {
  rpc Get(GetRequest) returns (GetResponse);
  rpc Put(PutRequest) returns (PutResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
}

service NodeHealthService {
  rpc Health(HealthRequest) returns (HealthResponse);
}

service ReplicaApplyService {
  rpc ApplyPut(PutRequest) returns (PutResponse);
  rpc ApplyDelete(DeleteRequest) returns (DeleteResponse);
}

enum RaftOperationType {
  RAFT_OPERATION_TYPE_UNSPECIFIED = 0;
  RAFT_OPERATION_TYPE_PUT = 1;
  RAFT_OPERATION_TYPE_DELETE = 2;
}

message RaftEntry {
  uint64 term = 1;
  uint64 index = 2;
  RaftOperationType operation_type = 3;
  bytes key = 4;
  bytes value = 5;
}

message RaftVoteRequest {
  string group_id = 1;
  string candidate_id = 2;
  uint64 term = 3;
  uint64 last_log_index = 4;
  uint64 last_log_term = 5;
}

message RaftVoteResponse {
  uint64 term = 1;
  bool vote_granted = 2;
  string leader_id = 3;
}

message RaftAppendEntriesRequest {
  string group_id = 1;
  string leader_id = 2;
  uint64 term = 3;
  uint64 prev_log_index = 4;
  uint64 prev_log_term = 5;
  repeated RaftEntry entries = 6;
  uint64 leader_commit = 7;
}

message RaftAppendEntriesResponse {
  uint64 term = 1;
  bool success = 2;
  uint64 match_index = 3;
  string leader_id = 4;
}

service RaftConsensusService {
  rpc RequestVote(RaftVoteRequest) returns (RaftVoteResponse);
  rpc AppendEntries(RaftAppendEntriesRequest) returns (RaftAppendEntriesResponse);
}
